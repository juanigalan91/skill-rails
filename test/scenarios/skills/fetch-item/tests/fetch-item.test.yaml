rails: ../rails.yaml
git: false
path: [stubs]
tests:
  - name: the connected tool reads the items, and the script does not run
    inputs: { ids: 'APP-1' }
    answers:
      tool: { available: true }
      show: {}
    expect:
      status: done
      steps: { script: skipped, ids/parse: success }
      files: { calls.log: absent }
  - name: the test stub replaces the plugin script, and flags follow the inputs
    inputs: { ids: 'APP-1, APP-2', format: json }
    answers:
      tool: { available: false }
      show: {}
    expect:
      status: done
      outputs: { script.value: fetched --format json APP-1 APP-2 }
  - name: exit code 3 goes on, and the retry drops the files flag
    inputs: { ids: APP-1, files: true }
    env: { STUB_FILES: refuse }
    answers:
      tool: { available: false }
      show: {}
    expect:
      status: done
      steps: { script: failure, retry: success }
      outputs: { retry.value: fetched --format text APP-1 }
  - name: another exit code fails the run, and on-failure saves the reason
    inputs: { ids: APP-1 }
    env: { STUB: down }
    answers:
      tool: { available: false }
    expect:
      status: failed
      message: /service down/
      files: { error.txt: /service down/ }
  - name: an input out of its enum is refused before the run
    inputs: { ids: APP-1, format: xml }
    expect:
      status: error
      message: /must be one of text, json/
  - name: a nested rails file failure ends the run, with its reason
    inputs: { ids: 'no ids' }
    expect:
      status: failed
      message: /No ID to read/
