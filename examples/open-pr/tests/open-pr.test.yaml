flow: ../flow.yaml
path: [stubs]
env:
  GIT_AUTHOR_NAME: test
  GIT_AUTHOR_EMAIL: test@example.com
  GIT_COMMITTER_NAME: test
  GIT_COMMITTER_EMAIL: test@example.com
# A local bare remote, and a branch with one commit ahead of main.
setup: |
  remote="$(mktemp -d)/origin.git"
  git init -q --bare "$remote"
  git remote add origin "$remote"
  git push -q origin main
  git checkout -q -b feat/add-a
  echo a > a.txt
  git add a.txt
  git commit -q -m "feat: add a"

tests:
  - name: interactive, new draft PR
    answers:
      draft: { answer: Draft }
      text: { title: 'feat: add a' }
    expect:
      status: done
      message: 'PR created: https://github.com/acme/app/pull/7'
      steps: { existing: skipped, push: success, update: skipped }

  - name: unattended, no questions
    inputs: { auto: true }
    answers:
      text: { title: 'feat: add a' }
    expect:
      status: done
      steps: { draft: skipped, create: success }

  - name: stops on the base branch
    setup: 'true'
    answers: {}
    expect:
      status: failed
      message: /base branch/
