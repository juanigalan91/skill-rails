          ---
          name: sample
          description: A migrated skill.
          ---
          Run rails.yaml with run-skill-rails.
        skill-flow: absent
        skill/SKILL.md.bak: absent
        skill/SKILL.original.md: absent
        skill/backup: absent
        skill/RULES.md: absent
  - name: stops on unresolved validation errors without restoring a backup
    answers:
      audit:
        brief: Migrate the existing sample skill in place.
        rules:
          - rule: Report migrated safely.
            destination: rails.yaml finish stop
      plan:
        name: sample
        description: A migrated skill.
        target: '{{cwd}}/skill'
        steps:
          - id: finish
            type: stop
            purpose: Report migrated safely.
      author:
        $files:
          skill/SKILL.md: |
            ---
            name: sample
            description: A migrated skill.
            ---
            Run rails.yaml with run-skill-rails.
          skill/rails.yaml: |
            name: sample
            steps: []
      fix: {}
    expect:
      status: failed
      message: /Validation failed/
      files:
        skill/SKILL.md: |
          ---
          name: sample
          description: A migrated skill.
          ---
          Run rails.yaml with run-skill-rails.
        skill-flow: absent
        skill/SKILL.md.bak: absent
        skill/SKILL.original.md: absent
        skill/backup: absent
        skill/RULES.md: absent
        skill/README.md: |
          keep supporting docs
        skill/scripts/helper.sh: |
          keep existing script
  - name: fails on a missing source
    inputs:
      source: '{{cwd}}/missing'
    answers: {}
    expect:
      status: failed
      steps:
        audit: not reached
      files:
        skill-flow: absent
        skill/SKILL.md.bak: absent
        skill/SKILL.original.md: absent
        skill/backup: absent
        skill/RULES.md: absent
  - name: fails on a directory without SKILL.md
    setup: mkdir skill
    answers: {}
    expect:
      status: failed
      steps:
        audit: not reached
      files:
        skill-flow: absent
        skill/SKILL.md.bak: absent
        skill/SKILL.original.md: absent
        skill/backup: absent
        skill/RULES.md: absent
