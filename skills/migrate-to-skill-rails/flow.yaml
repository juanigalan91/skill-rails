name: migrate-to-skill-rails
inputs:
  source: { type: string, required: true, description: Original skill folder or SKILL.md. }
  request: { type: string, description: Additional migration requirements. }
  auto: { type: boolean, default: false }
  compare: { type: boolean, default: false, description: Offer an optional paid live comparison. }
steps:
  - id: context
    run: node "$FLOW_DIR/scripts/context.mjs"
    env:
      SOURCE: ${{ inputs.source }}
  - id: audit
    prompt-file: prompts/audit.md
    output:
      type: object
      required: [brief, rules]
      properties:
        brief: { type: string, minLength: 1 }
        rules:
          type: array
          minItems: 1
          items:
            type: object
            required: [rule, destination]
            properties:
              rule: { type: string, minLength: 1 }
              destination: { type: string, minLength: 1 }
  - id: create
    uses: ../create-skill-rails/flow.yaml
    with:
      source: ${{ steps.context.outputs.source }}
      target: ${{ steps.context.outputs.target }}
      auto: ${{ inputs.auto }}
      request: 'Migrate the original skill, preserving every rule. ${{ inputs.request }} Migration brief: ${{ steps.audit.outputs.brief }} Rule mapping: ${{ toJSON(steps.audit.outputs.rules) }}'
  - id: consent
    if: ${{ inputs.compare && !inputs.auto }}
    ask:
      - id: answer
        header: Compare
        question: Run each version at least three times in disposable copies? This uses model tokens and may incur cost.
        options:
          - { label: Skip, description: Keep the deterministic test and rule-audit evidence. }
          - { label: Compare, description: Authorize the cost of the live comparison. }
  - id: compare
    if: ${{ steps.consent.outputs.answer == 'Compare' }}
    prompt-file: prompts/compare.md
    output:
      type: object
      required: [report]
      properties:
        report: { type: string, minLength: 1 }
  - stop: '${{ steps.create.outputs.message }} Original retained at ${{ steps.context.outputs.source }}. ${{ steps.compare.outputs.report || ''Live comparison not run; no live performance claims.'' }}'
