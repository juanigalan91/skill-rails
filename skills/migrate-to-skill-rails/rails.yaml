name: migrate-to-skill-rails
inputs:
  source: { type: string, required: true, description: Skill folder or SKILL.md to migrate in place. }
  request: { type: string, description: Additional migration requirements. }
  auto: { type: boolean, default: false }
steps:
  - id: context
    run: context.mjs
    env:
      SOURCE: ${{ inputs.source }}
  - id: readers
    run: readers.mjs
    env:
      SOURCE: ${{ steps.context.outputs.source }}
    stdout: json
  - id: assess
    prompt: prompts/assess.md
    output:
      type: object
      required: [verdict, reasons]
      properties:
        verdict: { enum: [migrate, partial, keep] }
        reasons: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
        keep: { type: array, items: { type: string } }
  - id: confirm
    if: ${{ steps.assess.outputs.verdict == 'keep' && !inputs.auto }}
    ask:
      - id: choice
        header: Migration
        question: "This skill is better as Markdown: ${{ join(steps.assess.outputs.reasons, '; ') }}"
        options:
          - { label: Keep it as Markdown (Recommended), description: Change nothing., value: keep }
          - { label: Migrate anyway, description: Write the rails file and replace the SKILL.md., value: migrate }
  - if: ${{ steps.assess.outputs.verdict == 'keep' && steps.confirm.outputs.choice != 'migrate' }}
    stop: "Kept as Markdown, with no change: ${{ join(steps.assess.outputs.reasons, '; ') }}"
  - id: audit
    prompt: prompts/audit.md
    output:
      type: object
      required: [brief, rules]
      properties:
        brief: { type: string, minLength: 1 }
        rules:
          type: array
          minItems: 1
          items:
            type: object
            required: [rule, destination]
            properties:
              rule: { type: string, minLength: 1 }
              destination: { type: string, minLength: 1 }
  - id: create
    uses: ../create-skill-rails/rails.yaml
    with:
      source: ${{ steps.context.outputs.source }}
      target: ${{ steps.context.outputs.target }}
      auto: ${{ inputs.auto }}
      request: 'Migrate the original skill, preserving every rule. ${{ inputs.request }} Migration brief: ${{ steps.audit.outputs.brief }} Rule mapping: ${{ toJSON(steps.audit.outputs.rules) }}'
  - stop: '${{ steps.create.outputs.message }} Migrated in place at ${{ steps.context.outputs.target }}.'
